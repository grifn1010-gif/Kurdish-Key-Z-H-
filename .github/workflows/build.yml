name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o KurdKeyNative.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build APK
        working-directory: proj/KurdKeyNative
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp proj/KurdKeyNative/app/build/outputs/apk/release/app-release.apk KurdishKeyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KurdishKeyboard-apk
          path: KurdishKeyboard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kurdish Keyboard v${{ github.run_number }}
          files: KurdishKeyboard.apk
