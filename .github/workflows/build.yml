name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q KurdKeyWeb.zip -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build APK
        working-directory: proj/KurdKeyWeb
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp proj/KurdKeyWeb/app/build/outputs/apk/debug/app-debug.apk KurdishKeyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KurdishKeyboard-apk
          path: KurdishKeyboard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kurdish Keyboard v${{ github.run_number }}
          files: KurdishKeyboard.apk
